name: CI

on: [push, pull_request]

jobs:
  matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [pgsql, mysql, mariadb, sqlite]
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le fichier d'environnement
        run: test -f .env || cp .env.example .env
      - name: Démarrer la pile
        run: docker compose up -d --build
      - name: Générer la clé d'application
        run: docker compose exec -T app php artisan key:generate
      - name: Qualité et tests
        run: docker compose exec -T -e DB_CONNECTION=${{ matrix.engine }} app composer check
